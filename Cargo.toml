[package]
name = "idokendo-net"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = "1.0"
Inflector = "0.11.4"
gloo = "0.10.0"
gloo-utils = "0.2.0"
include_dir = "0.7.4"
markdown = "1.0"
stylist = { version = "0.14.0", features = ["yew", "parser"] }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.76", features = ["HtmlInputElement", "console"] }
yew = { version = "0.22.0", features = ["csr"] }
yew-router = "0.19.0"
